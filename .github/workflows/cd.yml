name: Deploy Serverless API

on:
    push:
        branches:
            - main
            - develop

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

        env:
            # Secrets from GitHub
            REGION: ${{ vars.REGION }}
            MAX_ATTEMPTS: ${{ vars.MAX_ATTEMPTS }}
            LOG_LEVEL: ${{ vars.LOG_LEVEL }}
            NODE_ENV: ${{ vars.NODE_ENV }}

            # Determine stage based on branch
            STAGE: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

        permissions:
            id-token: write
            contents: read

        steps:
            - name: 🧾 Checkout source
              uses: actions/checkout@v4

            - name: ⚙️ Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20.15

            - name: 📦 Install dependencies
              run: npm ci

            - name: Create .env file
              run: |
                    echo "LOG_LEVEL=${{ vars.LOG_LEVEL }}" >> .env
                    echo "MAX_ATTEMPTS=${{ vars.MAX_ATTEMPTS }}" >> .env
                    echo "NODE_ENV=${{ vars.NODE_ENV }}" >> .env
                    echo "REGION=${{ vars.REGION }}" >> .env
                    echo "STAGE=${{ vars.STAGE }}" >> .env

            - name: 🌍 Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.REGION }}

            - name: 🚀 Deploy to AWS with Serverless
              run: npm run deploy:cd:${{ env.STAGE }}
